<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>شباب البدر</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f3ec; color: #1b2340; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
  a { color: #b9801a; }
</style>
</head>
<body>
<p id="msg">جارٍ فتح البطاقة…</p>
<script>
// Stable QR landing page. QR codes encode  <this page>?t=<cardToken>  and are
// forwarded to  <appUrl>/card/<cardToken>.  To move the app to another host,
// edit only "appUrl" in config.json — printed QR codes keep working.
(async function () {
  var msg = document.getElementById('msg');
  var token = new URLSearchParams(location.search).get('t');
  if (!token) { msg.textContent = 'رابط البطاقة غير صالح.'; return; }
  try {
    var res = await fetch('config.json', { cache: 'no-store' });
    var cfg = await res.json();
    var base = String(cfg.appUrl || '').replace(/\/+$/, '');
    if (!/^https?:\/\//i.test(base)) throw new Error('bad appUrl');
    location.replace(base + '/card/' + encodeURIComponent(token));
  } catch (e) {
    msg.textContent = 'تعذّر فتح البطاقة حالياً. حاول لاحقاً.';
  }
})();
</script>
</body>
</html>
