kind = "web"
previewPath = "/"
title = "شباب البدر — دوري المسابقة"
description = "منصة تنافسية لإدارة مسابقة شباب البدر، تربط الطلاب والمدربين بالمباريات والتحديات والأرصدة والبطاقات الرقمية في تجربة حماسية بطابع إسلامي."
version = "1.0.0"
id = "artifacts/shabab-albadr"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26058

[services.development]
run = "pnpm --filter @workspace/shabab-albadr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shabab-albadr", "run", "build" ]
serve = "static"
publicDir = "artifacts/shabab-albadr/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26058"
BASE_PATH = "/"
