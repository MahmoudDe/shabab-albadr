# Render Blueprint: one free Node web service that serves both the API and the
# built React app. Secrets (sync: false) are entered once in the Render dashboard.
services:
  - type: web
    name: shabab-albadr
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile --prod=false && NODE_ENV=production pnpm run build:deploy
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SESSION_SECRET
        generateValue: true
